[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

# --no-migrations crea el esquema directamente desde los modelos en vez de aplicar las
# 14 migraciones en cada corrida. Lo que se prueba es el comportamiento del sistema, no
# la cadena de migraciones; esa se comprueba al correr migrate de verdad.
addopts = --no-migrations
